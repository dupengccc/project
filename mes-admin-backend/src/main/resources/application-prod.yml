server:
  port: 8080

spring:
  datasource:
    url: jdbc:dm://10.0.0.10:5236/MES
    username: ${DB_USER:SYSDBA}
    password: ${DB_PWD:SYSDBA}
    dynamic:
      datasource:
        master:
          url: jdbc:dm://10.0.0.10:5236/MES
        slave:
          url: jdbc:dm://10.0.0.11:5236/MES_SLAVE
        mes:
          url: jdbc:mysql://10.0.0.12:3306/mes?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
          username: ${MES_USER:root}
          password: ${MES_PWD:root}
  jpa:
    show-sql: false
  redis:
    host: 10.0.0.20
    port: 6379
    password: ${REDIS_PWD:}
