server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: mes-admin
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # 本系统支持 Oracle 与 达梦(DM) 两种数据库
    # 达梦：  driver-class-name: dm.jdbc.driver.DmDriver       url: jdbc:dm://host:5236/SCHEMA
    # Oracle：driver-class-name: oracle.jdbc.OracleDriver      url: jdbc:oracle:thin:@host:1521:ORCL
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://127.0.0.1:5236/MES
    username: SYSDBA
    password: SYSDBA
    dynamic:
      datasource:
        master:
          driver-class-name: dm.jdbc.driver.DmDriver
          url: jdbc:dm://127.0.0.1:5236/MES
          username: SYSDBA
          password: SYSDBA
        slave:
          driver-class-name: dm.jdbc.driver.DmDriver
          url: jdbc:dm://127.0.0.1:5236/MES_SLAVE
          username: SYSDBA
          password: SYSDBA
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 60000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # Hibernate 方言，支持达梦与 Oracle：
    #   达梦：org.hibernate.dialect.DmDialect
    #   Oracle 12c+：org.hibernate.dialect.Oracle12cDialect
    #   Oracle 旧版：org.hibernate.dialect.Oracle10gDialect
    database-platform: org.hibernate.dialect.DmDialect
    properties:
      hibernate:
        format_sql: true
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 0
    timeout: 3000
    jedis:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

jwt:
  secret: mes-admin-secret-key-2026-very-long-secure-key
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

jodconverter:
  enabled: true
  office-home: /opt/openoffice.org3
  max-tasks-per-process: 200
  task-execution-timeout: 60000
  task-queue-timeout: 120000
  port-numbers: 8100,8101

knife4j:
  enable: true
  openapi:
    title: MES 制造执行系统 API 文档
    description: 基础数据 / 生产 / 仓储 / 质量 / 设备 / 工具 / 排班 管理 API
    version: 1.0.0
    concat: admin
